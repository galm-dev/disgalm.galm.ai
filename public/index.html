<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disgalm</title>
<style>
  :root {
    --bg: #313338; --bg2: #2b2d31; --bg3: #1e1f22; --bg4: #383a40;
    --txt: #dbdee1; --dim: #949ba4;
    --acc: #5865f2; --ok: #23a559; --bad: #da373c; --warn: #f0b132;
    --r: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--txt);
    font: 15px/1.4 "gg sans", system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; background: var(--bg4); border: 0;
           border-radius: var(--r); padding: .55rem .9rem; cursor: pointer; }
  button:hover:not(:disabled) { background: #4a4d55; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--acc); }
  button.perigo { background: var(--bad); }
  select, input[type=text] { font: inherit; color: inherit; background: var(--bg3);
           border: 1px solid #00000040; border-radius: var(--r); padding: .5rem; }

  /* ---------- entrada ---------- */
  #entrada { margin: auto; background: var(--bg2); padding: 2rem; border-radius: 12px;
             display: flex; flex-direction: column; gap: .8rem; width: min(22rem, 90vw); }
  #entrada h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
  #entrada button { background: var(--acc); padding: .7rem; }

  /* ---------- palco ---------- */
  #sala { flex: 1; display: none; grid-template-rows: 1fr auto auto; min-height: 0; }
  #sala.ativa { display: grid; }

  #palco { position: relative; background: #000; min-height: 0; display: flex; }
  #palco video { width: 100%; height: 100%; object-fit: contain; }
  #vazio { margin: auto; color: var(--dim); text-align: center; padding: 2rem; }

  #capa { position: absolute; inset: 0; display: flex; flex-direction: column;
          justify-content: space-between; padding: .8rem; opacity: 0; transition: opacity .15s;
          background: linear-gradient(#0007, transparent 25%, transparent 70%, #0009); }
  #palco:hover #capa, #capa:focus-within { opacity: 1; }
  #capa .topo, #capa .base { display: flex; align-items: center; gap: .6rem; }
  #capa .base { justify-content: flex-end; }
  .tag { background: #000000aa; border-radius: 99px; padding: .25rem .7rem; font-size: .85rem; }
  .live { background: var(--bad); font-weight: 600; letter-spacing: .04em; }
  .semaudio { background: var(--warn); color: #000; font-weight: 600; }
  #capa input[type=range] { width: 8rem; accent-color: var(--acc); }

  /* ---------- tira de participantes ---------- */
  #tira { display: flex; gap: .6rem; padding: .6rem; overflow-x: auto; background: var(--bg2); }
  .tile { flex: 0 0 11rem; background: var(--bg3); border-radius: var(--r); overflow: hidden;
          cursor: pointer; border: 2px solid transparent; position: relative; }
  .tile.focado { border-color: var(--acc); }
  .tile.falando { border-color: var(--ok); }
  .tile video { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
  .tile .semvideo { width: 100%; aspect-ratio: 16/9; display: grid; place-items: center;
                    font-size: 1.8rem; font-weight: 600; color: var(--dim); background: var(--bg4); }
  .tile .nome { padding: .35rem .5rem; font-size: .85rem; display: flex; align-items: center;
                gap: .35rem; justify-content: space-between; }
  .tile .badges { display: flex; gap: .3rem; align-items: center; font-size: .7rem; }
  .icone { width: 15px; height: 15px; color: var(--bad); flex: none; }
  .tile .env { padding: .2rem .5rem 0; font: 10px/1.3 ui-monospace, monospace; color: var(--dim); }
  .tile .env.limitado { color: var(--warn); }
  .tile .vols { padding: 0 .5rem .5rem; display: none; }
  .tile.aberto .vols { display: block; }
  .vols label { display: flex; align-items: center; gap: .4rem; font-size: .75rem; color: var(--dim); }
  .vols input { flex: 1; accent-color: var(--acc); min-width: 0; }

  /* ---------- barra ---------- */
  #barra { display: flex; gap: .5rem; padding: .7rem; background: var(--bg3);
           align-items: center; flex-wrap: wrap; }
  #barra .esq { display: flex; gap: .5rem; flex: 1; flex-wrap: wrap; }
  #diag { font: 11px/1.4 ui-monospace, monospace; color: var(--dim); }

  /* ---------- log ---------- */
  details#logbox { background: var(--bg3); border-top: 1px solid #00000040; }
  details#logbox summary { padding: .4rem .8rem; cursor: pointer; font-size: .8rem; color: var(--dim); }
  #log { font: 11px/1.5 ui-monospace, monospace; padding: 0 .8rem .8rem;
         max-height: 11rem; overflow-y: auto; white-space: pre-wrap; color: var(--dim); }
</style>

<div id="entrada">
  <h1>Disgalm</h1>
  <input id="sala-cod" type="text" placeholder="código da sala" value="galm">
  <input id="nome" type="text" placeholder="seu nome">
  <button id="entrar">Entrar</button>
</div>

<div id="sala">
  <div id="palco">
    <video id="v-palco" autoplay playsinline></video>
    <div id="vazio">Ninguém está compartilhando tela.<br><small>Clique num participante para focar.</small></div>
    <div id="capa">
      <div class="topo">
        <span class="tag" id="palco-nome"></span>
        <span class="tag live" id="palco-live" hidden>AO VIVO</span>
        <span class="tag semaudio" id="palco-semaudio" hidden>sem áudio</span>
      </div>
      <div class="base">
        <span class="tag" id="palco-stats"></span>
        <label class="tag">🔊 <input type="range" id="palco-vol" min="0" max="1" step="0.01" value="1"></label>
        <button id="b-pip" title="Picture-in-picture">⧉</button>
        <button id="b-full" title="Tela cheia">⛶</button>
      </div>
    </div>
  </div>

  <div id="tira"></div>

  <div id="barra">
    <div class="esq">
      <button id="b-mic">🎤 Mudo</button>
      <button id="b-surdo">🔇 Ensurdecer</button>
      <button id="b-tela">🖥 Compartilhar</button>
      <select id="loopdev" title="áudio do sistema (Linux)"></select>
      <select id="preset" title="qualidade da sua tela">
        <option value="codigo">Código · 1080p 5fps</option>
        <option value="equil" selected>Equilíbrio · 1080p 30fps</option>
        <option value="fluido">Fluido · 1080p 120fps</option>
        <option value="jogo">Jogo · 1440p 60fps</option>
        <option value="max">Máximo · 4K 60fps</option>
        <option value="manual">Manual…</option>
      </select>
      <button id="b-recap" hidden></button>
      <span id="manual" hidden>
        <select id="res">
          <option value="1280x720">720p</option>
          <option value="1920x1080" selected>1080p</option>
          <option value="2560x1440">1440p</option>
          <option value="3840x2160">4K</option>
        </select>
        <select id="fps">
          <option>5</option><option>10</option><option>15</option>
          <option selected>30</option><option>60</option><option>120</option>
        </select>
        <select id="kbps">
          <option value="1000">1 Mbps</option><option value="2500">2,5 Mbps</option>
          <option value="4000" selected>4 Mbps</option><option value="8000">8 Mbps</option>
          <option value="15000">15 Mbps</option><option value="25000">25 Mbps</option>
          <option value="40000">40 Mbps</option>
        </select>
        <select id="orc" title="orçamento total de subida, dividido entre os pares">
          <option value="0">sem teto total</option>
          <option value="10000">total 10 Mbps</option>
          <option value="20000" selected>total 20 Mbps</option>
          <option value="40000">total 40 Mbps</option>
          <option value="80000">total 80 Mbps</option>
        </select>
      </span>
    </div>
    <span id="diag"></span>
    <button id="b-sair" class="perigo">Sair</button>
  </div>
</div>

<details id="logbox">
  <summary>diagnóstico</summary>
  <div id="log"></div>
</details>

<script>
const $ = id => document.getElementById(id)
const log = (...a) => { $('log').textContent += a.join(' ') + '\n'; $('log').scrollTop = 1e9 }

// Presets de qualidade da própria tela. O bitrate ANDA JUNTO com resolução e
// fps de propósito: 4K60 num teto de 2,5 Mbps fica pior que 1080p30, porque o
// encoder gasta os bits espalhando-os por 4x mais pixels e 2x mais quadros.
// 'detail' preserva resolução sacrificando quadros (ler código); 'motion' faz
// o contrário (jogo) — foi o 'detail' que deixou tela de jogo parecendo travada.
const PRESETS = {
  codigo: { w: 1920, h: 1080, fps: 5,  kbps: 1500,  hint: 'detail' },
  equil:  { w: 1920, h: 1080, fps: 30, kbps: 4000,  hint: 'motion' },
  fluido: { w: 1920, h: 1080, fps: 120, kbps: 15000, hint: 'motion' },
  jogo:   { w: 2560, h: 1440, fps: 60, kbps: 12000, hint: 'motion' },
  max:    { w: 3840, h: 2160, fps: 60, kbps: 25000, hint: 'motion' },
}
let qualidade = { ...PRESETS.equil }

// Em malha você envia uma cópia para CADA par, e as conexões não coordenam
// entre si: cada uma sonda a banda sozinha e a que subir primeiro fica com
// ela. Declarar o teto POR PAR faz a subida total crescer a cada pessoa que
// entra. Declarar o total e dividir é o que evita uma conexão matar a outra.
const kbpsPorPar = () => {
  const orc = +($('orc')?.value || 0)
  if (!orc) return qualidade.kbps
  return Math.min(qualidade.kbps, Math.floor(orc / Math.max(1, pares.size)))
}

let ws, meuId, ice, micStream, telaStream
let foco = null, surdo = false

// Sem mic é o mesmo que mudo do ponto de vista de quem olha o tile.
const estouMudo = () => !micStream || !micStream.getAudioTracks()[0]?.enabled
const pares = new Map()

// ---------- estado anunciado ----------
// O receptor não tem como saber, olhando a track, se um áudio é voz ou tela.
// Quem compartilha anuncia o streamId da tela; isso também alimenta o badge
// AO VIVO e o aviso de "compartilhando sem áudio".
function anunciar(para) {
  const est = {
    compartilhando: !!telaStream,
    streamId: telaStream?.id || null,
    temAudio: !!telaStream?.getAudioTracks().length,
    mudo: estouMudo(),
    surdo,
  }
  const alvos = para ? [para] : [...pares.keys()]
  for (const id of alvos) sinalizar(id, { estado: est })
}

// ---------- mídia local ----------

async function listarLoopback() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput')
  $('loopdev').innerHTML = '<option value="">áudio do sistema: nenhum</option>' +
    devs.map(d => `<option value="${d.deviceId}">${d.label || 'sem label'}</option>`).join('')
  const loop = devs.find(d => /loopback|monitor|stereo mix/i.test(d.label))
  if (loop) $('loopdev').value = loop.deviceId
}

async function pegarMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    })
    medirFala('local', micStream)
  } catch (e) {
    micStream = null
    log(`microfone indisponível (${e.name}) — entrando sem voz`)
    $('b-mic').disabled = true
    $('b-mic').textContent = '🎤 sem mic'
  }
}

async function compartilhar() {
  if (telaStream) return pararTela()

  telaStream = await navigator.mediaDevices.getDisplayMedia({
    video: { width: { ideal: qualidade.w }, height: { ideal: qualidade.h },
             frameRate: { ideal: qualidade.fps } },
    audio: true,
  })

  if (telaStream.getAudioTracks().length === 0) {
    const dev = $('loopdev').value
    if (dev) {
      const s = await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: { exact: dev }, echoCancellation: false, noiseSuppression: false,
                 autoGainControl: false, channelCount: 2 },
      })
      telaStream.addTrack(s.getAudioTracks()[0])
      log('áudio do sistema via loopback')
    } else {
      log('AVISO: compartilhando SEM áudio. No Windows marque "compartilhar áudio do sistema" ' +
          'na aba Tela inteira; no Linux escolha o loopback na barra.')
    }
  }

  for (const t of telaStream.getTracks()) {
    t.contentHint = t.kind === 'video' ? qualidade.hint : 'music'
    t.onended = () => pararTela()
  }
  for (const [, p] of pares) for (const t of telaStream.getTracks()) p.pc.addTrack(t, telaStream)
  $('b-tela').textContent = '🖥 Parar'
  $('b-tela').classList.add('on')
  desenharTile('local')
  focar('local')
  anunciar()
  aplicarQualidade()
}

// Recria a captura na qualidade atual e troca a track nos senders existentes.
// replaceTrack não renegocia, então o receptor nem vê troca — e some o
// transceiver morto que o par removeTrack/addTrack deixava a cada ciclo.
async function recapturar() {
  if (!telaStream) return
  const q = qualidade
  const novo = await navigator.mediaDevices.getDisplayMedia({
    video: { width: { ideal: q.w }, height: { ideal: q.h }, frameRate: { ideal: q.fps } },
    audio: true,
  })

  const trocar = async (antigo, novoT) => {
    if (!novoT) return
    for (const [, p] of pares)
      for (const sd of p.pc.getSenders())
        if (sd.track === antigo) await sd.replaceTrack(novoT)
    if (antigo) { telaStream.removeTrack(antigo); antigo.stop() }
    telaStream.addTrack(novoT)
  }

  const vNovo = novo.getVideoTracks()[0]
  vNovo.contentHint = q.hint
  vNovo.onended = () => pararTela()
  await trocar(telaStream.getVideoTracks()[0], vNovo)

  const aNovo = novo.getAudioTracks()[0]
  if (aNovo) { aNovo.contentHint = 'music'; await trocar(telaStream.getAudioTracks()[0], aNovo) }

  desenharTile('local')
  if (foco === 'local') focar('local')
  anunciar()
  await aplicarQualidade()
}

function pararTela() {
  if (!telaStream) return
  const tracks = telaStream.getTracks()
  for (const [, p] of pares)
    for (const s of p.pc.getSenders())
      if (s.track && tracks.includes(s.track)) p.pc.removeTrack(s)
  for (const t of tracks) t.stop()
  telaStream = null
  $('b-tela').textContent = '🖥 Compartilhar'
  $('b-tela').classList.remove('on')
  desenharTile('local')
  if (foco === 'local') focar(proximoComVideo())
  anunciar()
}

// Aplica resolução/fps na captura e bitrate/fps no encoder de cada par.
// Depois relata PEDIDO vs OBTIDO: a captura não entrega 4K se o monitor não
// for 4K, e nesse caso o número escolhido é ficção.
async function aplicarQualidade() {
  const q = qualidade
  const vt = telaStream?.getVideoTracks()[0]

  if (vt) {
    vt.contentHint = q.hint
    try {
      await vt.applyConstraints({
        width: { ideal: q.w, max: q.w }, height: { ideal: q.h, max: q.h },
        frameRate: { ideal: q.fps, max: q.fps },
      })
    } catch (e) { log('applyConstraints:', e.message) }
  }

  for (const [, p] of pares)
    for (const s of p.pc.getSenders()) {
      if (s.track?.kind !== 'video') continue
      const par = s.getParameters()
      par.encodings = par.encodings?.length ? par.encodings : [{}]
      par.encodings[0].maxBitrate = kbpsPorPar() * 1000
      par.encodings[0].maxFramerate = q.fps
      await s.setParameters(par).catch(e => log('setParameters:', e.message))
    }

  const s = vt?.getSettings()
  if (s) {
    const obtido = `${s.width}x${s.height}@${Math.round(s.frameRate)}`
    log(`qualidade: pedido ${q.w}x${q.h}@${q.fps} · obtido ${obtido}`)

    // A sessão de captura nasce com a taxa pedida no getDisplayMedia e não
    // sobe depois: no Wayland é uma sessão do portal PipeWire já criada.
    // Baixar funciona; subir exige capturar de novo.
    const preciseRecap = Math.round(s.frameRate) < q.fps * 0.9
    $('b-recap').hidden = !preciseRecap
    $('b-recap').textContent = `↻ Recapturar p/ ${q.fps}fps`
    if (preciseRecap)
      log(`a captura está presa em ${Math.round(s.frameRate)}fps — a sessão foi criada nessa taxa. ` +
          `Recapture para subir para ${q.fps}fps.`)
  }
  atualizarDiag()
}

// Malha: você envia sua tela para cada par separadamente. É a conta que decide
// se 4K60 é viável no seu link, e ela cresce com o número de pessoas.
function custoUpload() {
  if (!telaStream) return ''
  const por = kbpsPorPar(), n = Math.max(1, pares.size)
  const tot = (por * n / 1000).toFixed(1)
  const cortado = por < qualidade.kbps ? ` (teto ${qualidade.kbps / 1000} cortado p/ ${por / 1000})` : ''
  return ` · subindo ~${tot} Mbps = ${por / 1000} × ${n}${cortado}`
}

// ---------- tiles e palco ----------

const inicial = n => (n || '?').trim()[0].toUpperCase()

// Mic cortado e fone cortado, desenhados à mão para ficarem legíveis a 15px.
const ICONES = {
  mudo: `<svg class="icone" viewBox="0 0 24 24" aria-label="microfone mudo"><title>microfone mudo</title>
    <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor"/>
    <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"/>
    <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  surdo: `<svg class="icone" viewBox="0 0 24 24" aria-label="ensurdecido"><title>ensurdecido</title>
    <path d="M4 14v-2a8 8 0 0 1 16 0v2" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"/>
    <rect x="2.5" y="13" width="4.5" height="7.5" rx="2.2" fill="currentColor"/>
    <rect x="17" y="13" width="4.5" height="7.5" rx="2.2" fill="currentColor"/>
    <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
}

function dadosTile(id) {
  if (id === 'local') return { nome: 'você', video: telaStream, local: true,
    estado: { compartilhando: !!telaStream, temAudio: !!telaStream?.getAudioTracks().length,
              mudo: estouMudo(), surdo } }
  const p = pares.get(id)
  return p && { nome: p.nome, video: p.video, estado: p.estado, local: false }
}

function desenharTile(id) {
  const d = dadosTile(id)
  if (!d) return document.getElementById('t-' + id)?.remove()

  let el = document.getElementById('t-' + id)
  if (!el) {
    el = document.createElement('div')
    el.id = 't-' + id
    el.className = 'tile'
    el.onclick = ev => {
      if (ev.target.closest('.vols')) return          // mexer no volume não troca o foco
      if (ev.target.closest('.nome')) el.classList.toggle('aberto')
      else focar(id)
    }
    $('tira').append(el)
  }

  const temVideo = d.video?.getVideoTracks().length
  el.innerHTML =
    (temVideo ? '<video autoplay playsinline muted></video>' : `<div class="semvideo">${inicial(d.nome)}</div>`) +
    `<div class="env"></div><div class="nome"><span>${d.nome}</span><span class="badges">
       ${d.estado?.mudo ? ICONES.mudo : ''}
       ${d.estado?.surdo ? ICONES.surdo : ''}
       ${d.estado?.compartilhando ? '<span class="tag live">LIVE</span>' : ''}
       ${d.estado?.compartilhando && !d.estado?.temAudio ? '<span class="tag semaudio">sem áudio</span>' : ''}
     </span></div>` +
    (d.local ? '' : `<div class="vols">
       <label>voz <input type="range" min="0" max="1" step="0.01" value="1" data-tipo="voz"></label>
       <label>tela <input type="range" min="0" max="1" step="0.01" value="1" data-tipo="tela"></label>
     </div>`)

  if (temVideo) el.querySelector('video').srcObject = d.video
  el.classList.toggle('focado', foco === id)

  for (const inp of el.querySelectorAll('.vols input')) {
    const p = pares.get(id)
    inp.value = p?.volumes[inp.dataset.tipo] ?? 1
    inp.oninput = () => {
      p.volumes[inp.dataset.tipo] = +inp.value
      aplicarVolumes(id)
      if (inp.dataset.tipo === 'tela' && foco === id) $('palco-vol').value = inp.value
    }
  }
}

function focar(id) {
  foco = id
  const d = id && dadosTile(id)
  const temVideo = d?.video?.getVideoTracks().length
  $('v-palco').srcObject = temVideo ? d.video : null
  $('v-palco').style.display = temVideo ? '' : 'none'
  $('vazio').style.display = temVideo ? 'none' : ''
  $('v-palco').muted = true   // o áudio sai pelos elementos <audio>, não pelo palco
  $('palco-nome').textContent = d?.nome || ''
  $('palco-live').hidden = !d?.estado?.compartilhando
  $('palco-semaudio').hidden = !(d?.estado?.compartilhando && !d?.estado?.temAudio)
  $('palco-vol').disabled = !d || d.local
  $('palco-vol').value = id && pares.get(id)?.volumes.tela || 1
  for (const el of document.querySelectorAll('.tile')) el.classList.toggle('focado', el.id === 't-' + id)
}

const proximoComVideo = () =>
  [...pares.keys()].find(id => pares.get(id).video.getVideoTracks().length) ||
  (telaStream ? 'local' : null)

// ---------- áudio recebido ----------

function aplicarVolumes(id) {
  const p = pares.get(id)
  if (!p) return
  for (const [, a] of p.audios) a.el.volume = surdo ? 0 : (p.volumes[a.tipo] ?? 1)
}

// Classifica a track pelo streamId anunciado por quem compartilha: o stream da
// tela é o único que ele anuncia. Sem isso, voz e tela são indistinguíveis aqui.
function classificar(id) {
  const p = pares.get(id)
  if (!p) return
  for (const [sid, a] of p.audios) a.tipo = sid === p.estado?.streamId ? 'tela' : 'voz'
  aplicarVolumes(id)
}

function receberAudio(id, track, streamId) {
  const p = pares.get(id)
  if (!p) return
  const el = document.createElement('audio')
  el.autoplay = true
  el.srcObject = new MediaStream([track])   // uma track por elemento: ver PLANO-POC.md
  el.play?.().catch(e => log(`autoplay bloqueado (${e.name}) — clique na página`))
  p.audios.set(streamId, { el, tipo: 'voz', track })
  track.addEventListener('ended', () => { el.remove(); p.audios.delete(streamId); })
  classificar(id)
  if (p.audios.size === 1) medirFala(id, el.srcObject)  // primeira = voz, move o anel verde
}

// Anel verde de quem está falando, reaproveitando o medidor dos PoCs.
function medirFala(id, stream) {
  const ctx = new AudioContext()
  ctx.resume()
  const an = ctx.createAnalyser()
  an.fftSize = 2048
  ctx.createMediaStreamSource(stream).connect(an)
  const buf = new Float32Array(an.fftSize)
  const tick = () => {
    if (id !== 'local' && !pares.has(id)) return
    an.getFloatTimeDomainData(buf)
    let s = 0
    for (const v of buf) s += v * v
    const db = 20 * Math.log10(Math.sqrt(s / buf.length) + 1e-12)
    document.getElementById('t-' + id)?.classList.toggle('falando', db > -50)
    requestAnimationFrame(tick)
  }
  tick()
}

// ---------- Opus estéreo ----------

const OPUS = 'stereo=1;sprop-stereo=1;maxaveragebitrate=128000;useinbandfec=1'

function opusEstereo(sdp) {
  const linhas = sdp.split(/\r\n|\n/)
  const pts = linhas.flatMap(l => l.match(/^a=rtpmap:(\d+) opus\/48000\/2$/)?.[1] ?? [])
  for (const pt of pts) {
    const i = linhas.findIndex(l => l.startsWith(`a=fmtp:${pt} `))
    if (i >= 0) {
      if (!linhas[i].includes('stereo=1')) linhas[i] += ';' + OPUS
    } else {
      const j = linhas.findIndex(l => l.startsWith(`a=rtpmap:${pt} `))
      linhas.splice(j + 1, 0, `a=fmtp:${pt} ${OPUS}`)
    }
  }
  return linhas.join('\r\n')
}

async function definirLocal(pc) {
  const sd = pc.signalingState === 'have-remote-offer' ? await pc.createAnswer() : await pc.createOffer()
  sd.sdp = opusEstereo(sd.sdp)
  await pc.setLocalDescription(sd)
}

// ---------- WebRTC ----------

function criarPar(id, nome, polite) {
  const pc = new RTCPeerConnection({ iceServers: ice })
  const p = { pc, polite, fazendoOferta: false, ignorandoOferta: false, nome,
              video: new MediaStream(), audios: new Map(), volumes: { voz: 1, tela: 1 }, estado: {} }
  pares.set(id, p)
  desenharTile(id)

  if (micStream) for (const t of micStream.getTracks()) pc.addTrack(t, micStream)
  if (telaStream) for (const t of telaStream.getTracks()) pc.addTrack(t, telaStream)

  pc.ontrack = e => {
    const sid = e.streams[0]?.id || 'sem-stream'
    log(`track ${e.track.kind} de ${nome}`)
    if (e.track.kind === 'audio') return receberAudio(id, e.track, sid)

    // Um <video> renderiza só a PRIMEIRA track de vídeo do stream: ao
    // recompartilhar, a antiga (morta) continuaria congelando o quadro.
    for (const antiga of p.video.getVideoTracks()) p.video.removeTrack(antiga)
    p.video.addTrack(e.track)
    e.track.addEventListener('ended', () => { p.video.removeTrack(e.track); desenharTile(id) })
    desenharTile(id)
    if (!foco || foco === 'local' && !telaStream) focar(id)
  }

  const tipos = new Set()
  pc.onicecandidate = e => {
    if (!e.candidate) return log(`candidatos de ${nome}: ${[...tipos].join(', ') || 'NENHUM'}`)
    if (!tipos.has(e.candidate.type)) {
      tipos.add(e.candidate.type)
      log(`candidato ${e.candidate.type}/${e.candidate.protocol} para ${nome}`)
    }
    sinalizar(id, { candidate: e.candidate })
  }
  pc.onicecandidateerror = e => log(`ICE erro ${e.errorCode} em ${e.url} — ${e.errorText}`)

  pc.oniceconnectionstatechange = () => {
    log(`${nome}: ${pc.iceConnectionState}`)
    if (pc.iceConnectionState === 'connected') { tipoDeCaminho(id, pc); acompanharVideo(id, pc) }
    if (pc.iceConnectionState === 'failed') porQueFalhou(id, pc)
  }

  pc.onnegotiationneeded = async () => {
    try {
      p.fazendoOferta = true
      await definirLocal(pc)
      sinalizar(id, { description: pc.localDescription })
    } catch (e) { log('negotiationneeded:', e.message) }
    finally { p.fazendoOferta = false }
  }
  return p
}

async function tipoDeCaminho(id, pc) {
  const st = await pc.getStats()
  let atual
  st.forEach(r => { if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated) atual = r })
  if (!atual) return
  const l = st.get(atual.localCandidateId), r = st.get(atual.remoteCandidateId)
  const via = l?.candidateType === 'relay' || r?.candidateType === 'relay' ? 'RELAY (TURN)' : 'direto'
  log(`caminho com ${pares.get(id)?.nome}: ${via} — ${l?.candidateType}/${r?.candidateType}`)
}

async function porQueFalhou(id, pc) {
  const st = await pc.getStats()
  const cand = new Map()
  st.forEach(r => { if (r.type.endsWith('candidate')) cand.set(r.id, r) })
  const linhas = []
  st.forEach(r => {
    if (r.type !== 'candidate-pair') return
    const l = cand.get(r.localCandidateId), rm = cand.get(r.remoteCandidateId)
    linhas.push(`  ${l?.candidateType}/${l?.protocol} → ${rm?.candidateType}: ${r.state}`)
  })
  log(`por que falhou com ${pares.get(id)?.nome}:\n${linhas.join('\n') || '  nenhum par formado'}`)
}

function acompanharVideo(id, pc) {
  let antes
  const timer = setInterval(async () => {
    if (!pares.has(id)) return clearInterval(timer)
    const st = await pc.getStats()
    let v
    st.forEach(r => { if (r.type === 'inbound-rtp' && r.kind === 'video') v = r })
    if (!v || !antes) { antes = v; return }
    const dt = (v.timestamp - antes.timestamp) / 1000
    const kbps = Math.round((v.bytesReceived - antes.bytesReceived) * 8 / dt / 1000)
    const fps = ((v.framesDecoded - antes.framesDecoded) / dt).toFixed(1)
    const perda = v.packetsLost - (antes.packetsLost ?? 0)
    const txt = `${v.frameWidth || '?'}x${v.frameHeight || '?'} · ${fps}fps · ${kbps}kbps` +
                `${perda > 0 ? ' · perdeu ' + perda : ''}${v.freezeCount ? ' · freezes ' + v.freezeCount : ''}`
    if (foco === id) $('palco-stats').textContent = txt
    antes = v

    // O que EU envio a ESTE par. Em malha cada conexão tem seu próprio encoder
    // e sua própria estimativa de banda, então dois receptores do mesmo emissor
    // podem receber qualidades diferentes. qualityLimitationReason diz o porquê.
    let o, cp
    st.forEach(r => {
      if (r.type === 'outbound-rtp' && r.kind === 'video') o = r
      if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') cp = r
    })
    const env = document.querySelector(`#t-${id} .env`)
    if (env) {
      if (!o) { env.textContent = ''; return }
      const banda = cp?.availableOutgoingBitrate
        ? ` · cabe ${Math.round(cp.availableOutgoingBitrate / 1000)}kbps` : ''
      const motivo = o.qualityLimitationReason && o.qualityLimitationReason !== 'none'
        ? ` · LIMITADO: ${o.qualityLimitationReason}` : ''
      env.textContent = `→ ${o.frameWidth || '?'}x${o.frameHeight || '?'}` +
        ` @${Math.round(o.framesPerSecond || 0)}fps${banda}${motivo}`
      env.classList.toggle('limitado', !!motivo)
    }
  }, 2000)
}

async function receberSinal(id, data) {
  const p = pares.get(id)
  if (!p) return
  const { pc } = p
  try {
    if (data.estado) {
      p.estado = data.estado
      classificar(id)
      desenharTile(id)
      if (foco === id) focar(id)
      return
    }
    if (data.description) {
      const colisao = data.description.type === 'offer' && (p.fazendoOferta || pc.signalingState !== 'stable')
      p.ignorandoOferta = !p.polite && colisao
      if (p.ignorandoOferta) return log(`oferta ignorada de ${p.nome} (impolite)`)
      await pc.setRemoteDescription(data.description)
      if (data.description.type === 'offer') {
        await definirLocal(pc)
        sinalizar(id, { description: pc.localDescription })
      }
    } else if (data.candidate) {
      try { await pc.addIceCandidate(data.candidate) } catch (e) { if (!p.ignorandoOferta) throw e }
    }
  } catch (e) { log('sinal:', e.message) }
}

// ---------- sinalização ----------

const sinalizar = (to, data) => ws?.readyState === 1 && ws.send(JSON.stringify({ t: 'signal', to, data }))

async function entrarNaSala() {
  ice = await (await fetch('/ice')).json()
  log('ICE:', ice.map(s => s.urls).flat().join(' '))
  await pegarMic()
  await listarLoopback()
  $('entrada').style.display = 'none'
  $('sala').classList.add('ativa')
  desenharTile('local')

  // Sala e nome vão na URL porque o Worker precisa deles ANTES do upgrade,
  // para escolher o Durable Object. O server.js local ignora a query e usa a
  // mensagem 'join'; o Worker ignora o 'join'. Um cliente serve aos dois.
  const cod = $('sala-cod').value.trim().toLowerCase()
  const meuNome = $('nome').value || 'anon'
  const proto = location.protocol === 'https:' ? 'wss' : 'ws'
  ws = new WebSocket(`${proto}://${location.host}/ws?sala=${encodeURIComponent(cod)}&nome=${encodeURIComponent(meuNome)}`)
  ws.onopen = () => ws.send(JSON.stringify({ t: 'join', room: cod, name: meuNome }))
  ws.onclose = () => log('sinalização caiu')
  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data)
    if (m.t === 'cheia') return alert('sala cheia (limite de 4)')
    if (m.t === 'welcome') {
      meuId = m.id
      for (const par of m.peers) criarPar(par.id, par.name, true)   // quem chega é polite
      atualizarDiag()
    }
    if (m.t === 'peer-join') {
      criarPar(m.id, m.name, false)                                 // quem já estava oferta
      anunciar(m.id)
      redividir()
    }
    if (m.t === 'signal') receberSinal(m.from, m.data)
    if (m.t === 'peer-left') {
      const p = pares.get(m.id)
      p?.pc.close()
      for (const [, a] of p?.audios || []) a.el.remove()
      pares.delete(m.id)
      document.getElementById('t-' + m.id)?.remove()
      if (foco === m.id) focar(proximoComVideo())
      redividir()
      log('saiu:', m.id)
    }
  }
}

const atualizarDiag = () => $('diag').textContent = `${pares.size + 1}/4 na sala` + custoUpload()

// Entrou ou saiu gente: o orçamento total se redivide por um número diferente
// de pares. Fica fora de atualizarDiag para não recursar com aplicarQualidade.
const redividir = () => { atualizarDiag(); if (telaStream) aplicarQualidade() }

addEventListener('unhandledrejection', e => log('ERRO não tratado:', e.reason?.message || e.reason))
addEventListener('error', e => log('ERRO:', e.message))

$('entrar').onclick = async () => {

  anunciar()
}

  ? document.exitFullscreen()
  : $('palco').requestFullscreen().catch(e => log('tela cheia:', e.message))

  ? document.exitPictureInPicture()
  : $('v-palco').requestPictureInPicture().catch(e => log('PiP:', e.message))

$('b-sair').onclick = () => location.reload()

function lerManual() {
  const [w, h] = $('res').value.split('x').map(Number)
  qualidade = { w, h, fps: +$('fps').value, kbps: +$('kbps').value,
                hint: +$('fps').value <= 10 ? 'detail' : 'motion' }
}

$('preset').onchange = () => {
  const v = $('preset').value
  $('manual').hidden = v !== 'manual'
  if (v === 'manual') lerManual()
  else {
    qualidade = { ...PRESETS[v] }
    $('res').value = `${qualidade.w}x${qualidade.h}`
    $('fps').value = String(qualidade.fps)
    $('kbps').value = String(qualidade.kbps)
  }
  aplicarQualidade()
}

$('b-recap').onclick = () => recapturar().catch(e => log(`recaptura: ${e.name}: ${e.message}`))
$('orc').onchange = () => aplicarQualidade()
for (const id of ['res', 'fps', 'kbps'])
  $(id).onchange = () => { lerManual(); aplicarQualidade() }

$('loopdev').onchange = () => log('áudio do sistema:', $('loopdev').selectedOptions[0]?.textContent)
