name = "disgalm"
main = "src/index.js"
compatibility_date = "2025-06-01"

# O cliente. Aponta para ../public, que contém SÓ arquivos de cliente: os
# segredos ficam em ../local, fora daqui. Assets são publicados na web, então
# um diretório com cert.pem dentro viraria chave privada acessível por URL.
[assets]
directory = "../public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SALA"
class_name = "Sala"

# Orçamento da franquia do Realtime (SFU + TURN), um objeto para a conta toda.
# Sem ele o /ice não emite TURN da Cloudflare e o SFU não publica nem assina.
[[durable_objects.bindings]]
name = "ORCAMENTO"
class_name = "Orcamento"

# new_sqlite_classes: só o backend SQLite existe no plano gratuito.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Orcamento"]

# Consumo do TURN para o Better Stack (evento turn_uso). De hora em hora porque
# a consulta agrupa por datetimeHour e a hora cheia anterior é o período; no
# minuto 10, para a analytics já ter fechado essa hora. São 24 consultas por
# dia, longe do limite do GraphQL (300 a cada 5 min), e um cron só dos cinco
# que o plano gratuito permite.
[triggers]
crons = ["10 * * * *"]

[observability]
enabled = true

[vars]
# Fase 1 do SFU, só ensaio: salas onde o Cloudflare Realtime SFU liga, separadas
# por vírgula (nome da sala em minúsculas, como na URL). Vazio: todas em malha.
# Também exige os secrets SFU_APP_ID e SFU_APP_SECRET; ver README.
SFU_SALAS = ""

# TURN_HOST, TURN_PORT, TURN_USER e TURN_PASS entram como secrets, nunca aqui:
#   ./wrangler.sh secret put TURN_HOST
# Sem eles o /ice devolve só um STUN público e o relay não existe.
